:root{--paper:#f2efe6;--ink:#21201d;--muted:#625f57;--red:#cb3829;--blue:#214cab;--yellow:#e9b928;--line:#d1cdc2;--sans:'DM Sans',Arial,sans-serif;--display:'Manrope','Avenir Next',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:5px}button{color:inherit}header{display:flex;justify-content:space-between;align-items:center;padding:24px 4.5vw 19px;border-bottom:1px solid var(--ink);gap:20px}.brand{display:flex;align-items:center;gap:14px;font:800 13px var(--display);letter-spacing:.09em;text-transform:uppercase}.logo{width:26px;height:26px;background:var(--red);border-radius:50%;position:relative}.logo:after{content:'';position:absolute;width:13px;height:26px;left:13px;top:0;background:var(--blue);border-radius:0 26px 26px 0}.top-actions{display:flex;gap:22px;align-items:center}.quiet{border:0;background:none;padding:8px 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase}.edition{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.deck{min-height:calc(100svh - 153px);display:grid;grid-template-columns:52px 1fr;max-width:1800px;margin:auto}.rail{border-right:1px solid var(--ink);display:flex;align-items:center;justify-content:center}.rail span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.22em;text-transform:uppercase}.slide{padding:38px 4.3vw 26px;display:flex;flex-direction:column;min-width:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.17em;display:flex;align-items:center;gap:14px}.eyebrow:before{content:'';width:25px;height:4px;background:var(--red)}.body{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(380px,1.15fr);gap:5vw;align-items:center;flex:1;min-width:0}.copy{padding:30px 0}.copy h1{font:500 clamp(40px,4.3vw,74px)/1.05 var(--display);letter-spacing:-.065em;margin:0 0 24px;max-width:660px}.copy h1 em{font-family:Georgia,serif;font-weight:400;letter-spacing:-.055em;color:var(--red)}.intro{font-size:clamp(16px,1.4vw,21px);line-height:1.55;max-width:510px;margin:0 0 22px}.formula{font-size:16px;line-height:1.6;border-left:3px solid var(--blue);padding:4px 0 4px 17px;margin:26px 0;letter-spacing:.01em}.project{display:grid;grid-template-columns:65px 1fr;gap:12px;padding-top:18px;border-top:1px solid var(--line);max-width:520px;font-size:13px;line-height:1.6;color:var(--muted)}.project strong{font-size:10px;letter-spacing:.1em;color:var(--ink);text-transform:uppercase;padding-top:3px}.visual{min-width:0;position:relative}.canvas-wrap{width:100%;aspect-ratio:1.32;position:relative}canvas{width:100%;height:100%;display:block}.figure-meta{display:flex;justify-content:space-between;gap:15px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line);padding:12px 0}.controls{padding-top:17px;display:flex;gap:18px;align-items:center;min-height:72px;flex-wrap:wrap}.control{flex:1;min-width:130px}.control label{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:9px}.control output{font-weight:700;font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;accent-color:var(--red);height:18px;margin:0}select{width:100%;border:0;border-bottom:1px solid var(--ink);padding:7px 0;background:transparent;border-radius:0;font-size:12px}.readout{font-size:12px;min-height:32px;line-height:1.5;margin:10px 0 0;color:var(--blue)}.note{font-size:11px;line-height:1.6;color:var(--muted);margin:0;max-width:690px}.source{color:inherit}.slide-bottom{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-top:15px}.transport{display:flex;align-items:center;gap:14px;flex-shrink:0}.transport button{border:1px solid var(--line);border-radius:50%;width:36px;height:36px;background:transparent;font-size:14px}.transport .replay{width:auto;border:none;border-radius:0;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.timeline{height:2px;width:72px;background:var(--line)}.timeline i{display:block;height:100%;background:var(--blue);width:0}footer{display:flex;padding:18px 4.5vw;align-items:center;gap:25px;border-top:1px solid var(--ink);height:76px}.counter{font:500 16px var(--display);white-space:nowrap}.counter span{color:var(--muted);font-size:12px}.progress{display:flex;gap:4px;flex:1;max-width:560px}.progress button{padding:10px 0;border:0;background:transparent;flex:1;position:relative;height:30px;min-width:5px}.progress button:before{content:'';display:block;height:3px;background:var(--line)}.progress button[aria-current=true]:before{background:var(--red);height:6px}.footer-hint{margin-left:auto;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.nav{display:flex;gap:10px}.nav button{height:40px;width:48px;border:1px solid var(--ink);background:transparent;font-size:20px}.nav button:last-child{background:var(--ink);color:var(--paper)}button:disabled{opacity:.25;cursor:default}dialog{border:1px solid var(--ink);background:var(--paper);color:var(--ink);max-width:850px;width:90%;padding:30px;max-height:85svh}dialog::backdrop{background:#21201d99}dialog h2{font:500 32px var(--display);margin:0 0 25px}.index-head{display:flex;justify-content:space-between;align-items:center}.index-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}.index-grid button{text-align:left;display:flex;gap:18px;border:0;border-top:1px solid var(--line);padding:13px 0;background:none;font-size:13px}.index-grid span{color:var(--red);font-size:11px}.entered .copy,.entered .visual{animation:enter .45s ease both}.entered .visual{animation-delay:.06s}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect <script>
'use strict';
const $=id=>document.getElementById(id), C={paper:'#f2efe6',ink:'#21201d',muted:'#625f57',red:'#cb3829',blue:'#214cab',yellow:'#e9b928',line:'#d1cdc2'};
const slides=[
{type:'cover',chapter:'Um atlas de modelos',title:'A forma<br>de <em>prever.</em>',intro:'Como diferentes modelos transformam o perfil de uma pessoa e de um filme em uma previsão de estrelas.',formula:'Um mesmo problema. Diferentes maneiras de aprender.',project:'Um passeio pelos modelos dos notebooks 03 a 09, com os baselines e o protocolo de comparação.',figure:'Geometria de uma previsão',note:'Exemplos didáticos e dados sintéticos ilustrativos. As animações não representam resultados dos experimentos.'},
{type:'problem',chapter:'01 / O problema',title:'Uma nota,<br>muitos <em>sinais.</em>',intro:'Cada observação combina um usuário e um filme. Queremos estimar a nota esperada desse encontro, usando apenas os atributos disponíveis.',formula:'ŷ = f(perfil do usuário, atributos do filme)',project:'4.000 pares de treino, 10 atributos brutos, notas de 0 a 5. pair_id identifica a linha e fica fora do modelo.',figure:'O encontro entre dois perfis',note:'As previsões finais são reais e limitadas a [0, 5]. Não arredondamos as notas.'},
{type:'features',chapter:'02 / Engenharia de atributos',title:'O gênero<br>encontra o <em>gosto.</em>',intro:'A afinidade seleciona a proporção do gênero do filme no histórico do usuário. Ela torna explícita uma interação que a regressão bruta não representa.',formula:'afinidade = share do gênero do filme',project:'Também testamos log1p das contagens, afinidade², interações e encolhimento das médias. A referência do encolhimento vem só do treino da dobra.',figure:'Um usuário, três possíveis filmes',control:[['genre','Gênero do filme','select',['action','comedy','drama'],1]],note:'Perfil ilustrativo: ação 20%, comédia 50%, drama 30%. A afinidade é determinística e não usa o alvo.'},
{type:'constant',chapter:'03 / Baseline',title:'A mesma nota<br>para <em>todos.</em>',intro:'O modelo constante ignora os atributos e prevê a média das notas de treino. Essa média minimiza a soma dos erros ao quadrado entre previsões constantes.',formula:'ŷ = média das notas no treino',project:'DummyRegressor(strategy="mean") é nossa referência mínima. Um modelo útil precisa melhorar esse patamar na validação.',figure:'Uma linha na média',note:'Os segmentos verticais mostram resíduos. Esta é uma amostra didática, não o RMSE oficial do projeto.'},
{type:'linear',chapter:'04 / Baseline linear',title:'Somar<br><em>contribuições.</em>',intro:'A regressão linear soma atributos multiplicados por coeficientes. O ajuste escolhe esses coeficientes para reduzir os erros ao quadrado.',formula:'ŷ = β₀ + β₁x₁ + … + βₚxₚ',project:'A baseline usa atributos brutos com afinidade. Uma relação curva exige novos atributos, como afinidade², mesmo mantendo o modelo linear nos coeficientes.',figure:'A melhor reta para esta amostra',note:'Uma única dimensão aparece no gráfico para facilitar a leitura. O modelo do notebook usa vários atributos.'},
{type:'ridge',chapter:'05 / Notebook 03',title:'Ridge:<br>pesos <em>menores.</em>',intro:'O Ridge acrescenta um custo para coeficientes grandes. Aceitar um pouco mais de erro no treino pode tornar as previsões mais estáveis.',formula:'Objetivo = erro quadrático + λ ∑ βⱼ²',project:'Comparamos Ridge bruto, Ridge com afinidade e Ridge com engenharia. A padronização fica no pipeline e alpha controla a penalização.',figure:'Encolhimento dos coeficientes',control:[['lambda','Força da penalização',0,2,.05,.5]],note:'Exemplo com atributos ortogonais normalizados e objetivo (1/2)‖y−Xβ‖² + (λ/2)‖β‖². A escala de λ é didática e difere de alpha no sklearn.'},
{type:'lasso',chapter:'06 / Notebook 03',title:'Lasso:<br>alguns pesos <em>zeram.</em>',intro:'A penalização pelo valor absoluto pode levar coeficientes exatamente a zero. O modelo combina ajuste e seleção de atributos.',formula:'Objetivo = erro quadrático + λ ∑ |βⱼ|',project:'O Lasso recebe os atributos construídos e padronizados. Com atributos correlacionados, a escolha de qual coeficiente zerar pode variar entre amostras.',figure:'Seleção pelo encolhimento',control:[['lambda','Força da penalização',0,2,.05,.5]],note:'Exemplo ortogonal com objetivo (1/2)‖y−Xβ‖² + λ‖β‖₁. Zero significa ausência de contribuição neste modelo, não ausência de importância causal.'},
{type:'elastic',chapter:'07 / Notebook 03',title:'Elastic Net:<br>duas <em>penalizações.</em>',intro:'Combina o efeito de seleção do Lasso com o encolhimento do Ridge. A mistura pode ajudar quando vários atributos carregam informação semelhante.',formula:'Penalização = λ [ρ ∑ |βⱼ| + (1−ρ)/2 ∑ βⱼ²]',project:'Testamos alpha e l1_ratio. Uma mistura próxima de 1 enfatiza Lasso. Próxima de 0 enfatiza Ridge.',figure:'A mistura entre L1 e L2',control:[['lambda','Força λ',0,2,.05,.8],['rho','Mistura Lasso ρ',0,1,.05,.5]],note:'Caminho exato para um exemplo ortogonal normalizado. O intercepto não recebe penalização.'},
{type:'splines',chapter:'08 / Notebook 04',title:'Splines:<br>curvas por <em>partes.</em>',intro:'Bases de curvas locais se combinam em uma função suave. Os nós definem onde as bases mudam de trecho. Ridge controla os pesos dessas bases.',formula:'ŷ = β₀ + ∑ βⱼ Bⱼ(x)',project:'Aplicamos splines cúbicos à afinidade, médias, idade e ano. Os demais atributos passam diretamente. Esse modelo é aditivo nessas bases.',figure:'Bases locais, uma curva contínua',control:[['knots','Quantidade de nós',3,8,1,5],['penalty','Regularização',0,1,.01,.03]],note:'Aqui ajustamos bases B-spline cúbicas em uma dimensão. No notebook, SplineTransformer gera as bases dentro de cada dobra.'},
{type:'knn',chapter:'09 / Notebook 05',title:'kNN:<br>aprender com os <em>vizinhos.</em>',intro:'Para prever uma nova observação, procuramos os k perfis mais próximos e combinamos suas notas. O conceito de distância depende da escala dos atributos.',formula:'ŷ = média das notas dos k vizinhos',project:'Testamos k e pesos uniformes ou por distância. StandardScaler aprende as escalas somente no treino de cada dobra.',figure:'Proximidade no espaço de perfis',control:[['k','Número de vizinhos',1,18,1,5],['weights','Peso dos vizinhos','select',['uniforme','por distância'],0]],note:'Quadrado preto: novo par. Círculos destacados: vizinhos. As duas coordenadas representam atributos já normalizados. As notas estão nos pontos.'},
{type:'tree',chapter:'10 / Notebook 06',title:'Árvore:<br>dividir para <em>prever.</em>',intro:'Cada corte separa exemplos com notas diferentes. Dentro de uma folha, a árvore prevê a média das notas de treino que chegaram ali.',formula:'Se x ≤ corte, vá à esquerda. Caso contrário, à direita.',project:'A profundidade e o tamanho mínimo das folhas limitam a complexidade. Folhas muito pequenas podem memorizar o ruído do treino.',figure:'Cortes e médias por região',control:[['depth','Profundidade máxima',1,5,1,2]],note:'Árvore de regressão ajustada nesta amostra 1D, escolhendo cortes por erro quadrático. Em várias dimensões, cada nó pode escolher outro atributo.'},
{type:'forest',chapter:'11 / Notebook 06',title:'Random Forest:<br>a média de <em>muitas árvores.</em>',intro:'Cada árvore vê uma amostra bootstrap do treino e considera subconjuntos aleatórios de atributos nos cortes. A média ajuda a reduzir a variância.',formula:'ŷ = (previsão₁ + … + previsãoₘ) / m',project:'Usamos 120 árvores e ajustamos min_samples_leaf e max_features. As árvores são independentes entre si durante o ajuste.',figure:'Árvores diferentes, previsão conjunta',control:[['trees','Árvores na ilustração',1,12,1,6]],note:'Linhas claras: árvores. Linha azul: média. Aqui há só um atributo, portanto a diversidade vem do bootstrap. O experimento real também sorteia atributos.'},
{type:'extra',chapter:'12 / Notebook 06',title:'Extra Trees:<br>mais acaso nos <em>cortes.</em>',intro:'Além de sortear atributos, o método sorteia limiares candidatos e escolhe entre eles. A média de árvores diversas pode reduzir a variância.',formula:'Limiares aleatórios + escolha do melhor candidato + média',project:'No nosso ExtraTreesRegressor, bootstrap permanece desativado. Cada árvore usa todo o treino, com aleatoriedade nos cortes.',figure:'A diversidade dos limiares',control:[['trees','Árvores na ilustração',1,12,1,6]],note:'Ilustração 1D com um limiar candidato aleatório por nó e sem bootstrap. O algoritmo real compara candidatos de diferentes atributos.'},
{type:'boost',chapter:'13 / Notebook 07',title:'Boosting:<br>corrigir o que <em>sobrou.</em>',intro:'A primeira previsão é simples. Cada nova árvore aprende uma correção para o erro do conjunto atual. Com perda quadrática, ela ajusta os resíduos.',formula:'Fₜ(x) = Fₜ₋₁(x) + η · árvoreₜ(x)',project:'GradientBoostingRegressor usa 200 árvores. Testamos profundidade e learning_rate. A taxa η define quanto de cada correção entra na previsão.',figure:'Uma sequência de correções',control:[['rounds','Etapas de boosting',0,30,1,8],['eta','Taxa de aprendizado η',.03,.5,.01,.2]],note:'Boosting quadrático ajustado na amostra ilustrativa, com árvores de profundidade 2. Aumentar as etapas nem sempre melhora a validação.'},
{type:'hist',chapter:'14 / Notebook 07',title:'Histogramas:<br>agrupar para <em>buscar cortes.</em>',intro:'O HistGradientBoosting agrupa valores contínuos em faixas. As árvores procuram cortes entre essas faixas, reduzindo a quantidade de candidatos.',formula:'Valores contínuos → faixas → árvores em sequência',project:'Também usamos 200 iterações, com max_leaf_nodes e l2_regularization na busca. No sklearn, os bins e os cortes são aprendidos no treino.',figure:'A resolução da busca',control:[['bins','Faixas na ilustração',4,24,1,8]],note:'A demonstração usa faixas de largura igual e boosting com 12 etapas. O sklearn usa uma estratégia de binning baseada em quantis, com tratamento de valores repetidos.'},
{type:'svr',chapter:'15 / Notebook 08',title:'SVR:<br>uma faixa de <em>tolerância.</em>',intro:'A SVR equilibra a complexidade da função com desvios além de uma faixa ε. O kernel RBF permite relações não lineares suaves.',formula:'Perda ε-insensível = máximo(0, |y−f(x)| − ε)',project:'Padronizamos os atributos. C pesa as violações, gamma define a escala do kernel e epsilon define a tolerância. A busca inicial mantém epsilon = 0,1.',figure:'Desvios dentro e fora do tubo',control:[['epsilon','Tolerância ε',.05,1,.05,.35]],note:'Esquema de perda para uma curva fixa, sem executar o otimizador da SVR. Os pontos fora do tubo têm perda positiva. Pontos na borda também podem ser vetores de suporte.'},
{type:'mlp',chapter:'16 / Notebook 09',title:'Rede neural:<br>compor <em>transformações.</em>',intro:'Cada camada combina entradas, aplica uma função de ativação e passa o resultado adiante. No treino, a retropropagação calcula como ajustar os pesos para reduzir a perda.',formula:'entrada → camadas com ReLU → saída linear',project:'Testamos (32,) e (32, 16), penalização L2 e parada antecipada. A validação da parada fica dentro do conjunto usado para ajustar a rede.',figure:'O caminho de uma previsão',control:[['affinity','Afinidade do par',0,1,.01,.6]],note:'Rede didática de pesos fixos, com 3 entradas e 2 camadas pequenas. O fluxo animado mostra a propagação direta. A rede real aprende pesos por otimização.'},
{type:'cv',chapter:'17 / Comparação',title:'Comparar no que<br>ficou <em>de fora.</em>',intro:'A busca interna escolhe hiperparâmetros. A dobra externa mede o erro do procedimento sem participar dessa escolha. Todas as famílias usam as mesmas partições.',formula:'RMSE = √ média [(nota real − previsão)²]',project:'5 dobras externas × 3 repetições, com busca interna de 3 dobras. Todo pré-processamento fica no pipeline. O teste entra só na previsão final.',figure:'Validação aninhada',control:[['fold','Dobra externa',1,5,1,1]],note:'O menor erro entre famílias ainda pode ser otimista pela própria seleção. Dobras compartilham dados e seu desvio não é um intervalo de confiança.'},
{type:'end',chapter:'18 / Leitura dos experimentos',title:'Entender antes<br>de <em>escolher.</em>',intro:'O melhor modelo precisa melhorar a previsão em dados não usados no ajuste. A interpretação deve explicar o ganho, o custo e as limitações.',formula:'Hipótese → experimento → evidência → conclusão',project:'Execute os notebooks, examine resíduos e escolhas por dobra. Depois releia o trabalho e reescreva as explicações com as palavras do grupo.',figure:'O ciclo do trabalho',note:'Leia também proximos-passos.md. As curvas desta apresentação explicam mecanismos e não estabelecem um ranking de desempenho.',references:true}
];
let index=0, values={}, progress=0, playing=false, last=0, raf=0;
const canvas=$('canvas'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

 else{input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=start;values[key]=start;output.value=String(start).replace('.',',');}

function go(n,update=true){index=clamp(n,0,slides.length-1);const s=slides[index];pause();$('slide').classList.remove('entered');$('eyebrow').textContent=s.chapter;$('title').innerHTML=s.title;$('intro').textContent=s.intro;$('formula').textContent=s.formula;$('project').textContent=s.project;$('figureTitle').textContent=s.figure;$('note').textContent=s.note;$('canvas').setAttribute('aria-label',s.figure+'. '+s.intro);$('references').innerHTML=s.references?'<p>Documentação: <a href="https://scikit-learn.org/stable/modules/linear_model.html" target="_blank" rel="noopener">Lineares</a><a href="https://scikit-learn.org/stable/modules/ensemble.html" target="_blank" rel="noopener">Ensembles</a><a href="https://scikit-learn.org/stable/modules/svm.html" target="_blank" rel="noopener">SVR</a><a href="https://scikit-learn.org/stable/modules/neural_networks_supervised.html" target="_blank" rel="noopener">MLP</a></p>':'';controls(s);$('counter').innerHTML=String(index+1).padStart(2,'0')+' <span>/ '+slides.length+'</span>';$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;[...$('progress').children].forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));if(update)history.replaceState(null,'','#slide-'+(index+1));progress=reduced?1:0;resize();void $('slide').offsetWidth;$('slide').classList.add('entered');$('time').style.width=progress*100+'%';if(!reduced)play();}
slides.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',`Slide ${i+1}: ${s.chapter}`);b.addEventListener('click',()=>go(i));$('progress').appendChild(b);const item=document.createElement('button');item.innerHTML='<span>'+String(i+1).padStart(2,'0')+'</span>'+s.title.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');item.addEventListener('click',()=>{$('index').close();go(i);});$('indexGrid').appendChild(item);});
$('next').onclick=()=>go(index+1);$('prev').onclick=()=>go(index-1);$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{if(reduced){progress=1;draw(1);}else play(true);};$('indexBtn').onclick=()=>$('index').showModal();$('closeIndex').onclick=()=>$('index').close();$('fullBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{read('Use o modo de tela cheia do seu navegador.');}};
document.addEventListener('keydown',e=>{if($('index').open||['INPUT','SELECT'].includes(e.target.tagName))return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(index+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1);}if(e.code==='Space'&&!['BUTTON','A'].includes(e.target.tagName)){e.preventDefault();playing?pause():play();}if(e.key==='Home'){e.preventDefault();go(0);}if(e.key==='End'){e.preventDefault();go(slides.length-1);}});
window.addEventListener('resize',resize);window.addEventListener('hashchange',()=>{const n=Number(location.hash.replace('#slide-',''));if(n>=1&&n<=slides.length)go(n-1,false);});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
const initial=Number(location.hash.replace('#slide-',''));go(initial>=1&&initial<=slides.length?initial-1:0,false);if(document.fonts)document.fonts.ready.then(resize);
</script>
